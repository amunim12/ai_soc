apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-soc-wazuh-bridge
  namespace: ai-soc
  labels:
    app: ai-soc-wazuh-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-soc-wazuh-bridge
  template:
    metadata:
      labels:
        app: ai-soc-wazuh-bridge
    spec:
      containers:
        - name: wazuh-bridge
          image: ghcr.io/amunim12/ai-soc-api:latest
          command: ["python"]
          args: ["-m", "bridge.wazuh_kafka_bridge"]
          envFrom:
            - configMapRef:
                name: ai-soc-config
            - configMapRef:
                name: ai-soc-site-config
            - secretRef:
                name: ai-soc-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
