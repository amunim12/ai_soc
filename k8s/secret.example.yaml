# Template only — do NOT run `kubectl apply -f` on this file and never commit
# real values here. The actual Secret is created imperatively by
# scripts/k8s-setup-secrets.sh (Task 11), the same way backend/.env.example
# documents shape without holding real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ai-soc-secrets
  namespace: ai-soc
type: Opaque
stringData:
  JWT_SECRET_KEY: "<CHANGE_ME - generate with: python3 -c \"import secrets; print(secrets.token_hex(64))\">"
  DEFAULT_ADMIN_PASSWORD: "<CHANGE_ME - generate with: python3 -c \"import secrets; print(secrets.token_hex(20))\">"
  POSTGRES_PASSWORD: "<CHANGE_ME - generate with: python3 -c \"import secrets; print(secrets.token_hex(32))\">"
  REDIS_PASSWORD: "<CHANGE_ME - generate with: python3 -c \"import secrets; print(secrets.token_hex(32))\">"
  POSTGRES_DSN: "postgresql://soc:<POSTGRES_PASSWORD>@postgres-0.postgres:5432/soc_pipeline"
  REDIS_URL: "redis://:<REDIS_PASSWORD>@redis-0.redis:6379/0"
  SHUFFLE_API_KEY: "<CHANGE_ME - obtain from your Shuffle instance; this key is always required by the app even if SOAR_ENABLED=false - use the literal value 'not-configured' in that case>"
  WAZUH_USER: "<CHANGE_ME - Wazuh API user, typically 'wazuh'>"
  WAZUH_PASSWORD: "<CHANGE_ME - Wazuh API password; without it the bridge silently ingests nothing>"
  WAZUH_INDEXER_USER: "<CHANGE_ME - Wazuh indexer (OpenSearch) user, typically 'admin'>"
  WAZUH_INDEXER_PASSWORD: "<CHANGE_ME - Wazuh indexer password; bridge falls back to WAZUH_PASSWORD if unset>"
