#
# Scheduled Security Scan — runs weekly (Monday 02:00 UTC).
#
# Catches vulnerabilities introduced by newly published CVEs between PRs:
#   1. trivy-rescan     — re-scan the latest published container image
#   2. zap-rescan       — OWASP ZAP API scan against the latest image
#   3. dependency-review — pip-audit + npm audit on current main

name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 2 * * 1"   # 02:00 UTC every Monday
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read
  security-events: write
  issues: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-soc-api
  JWT_SECRET_KEY: "ci-only-not-for-production-padding-1234567890abcdef1234567890abcdef"
  DEFAULT_ADMIN_PASSWORD: "ci-admin-password-not-production"
  USE_MOCK_TI: "true"
  SOAR_ENABLED: "false"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ── 1. Container rescan ───────────────────────────────────────────────────
  trivy-rescan:
    name: "1 · Trivy Container Rescan"
    runs-on: ubuntu-latest
    steps:
      - name: Trivy — rescan latest published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-scheduled.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: false

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-scheduled

      - name: Check for CRITICAL findings and open issue
        run: |
          CRITICALS=$(python3 - <<'EOF'
          import json, sys
          try:
              with open("trivy-scheduled.sarif") as f:
                  sarif = json.load(f)
              count = sum(
                  1 for run in sarif.get("runs", [])
                  for result in run.get("results", [])
                  if result.get("level") == "error"
              )
              print(count)
          except Exception:
              print(0)
          EOF
          )
          echo "Critical findings: $CRITICALS"
          echo "CRITICAL_COUNT=$CRITICALS" >> $GITHUB_ENV

      - name: Open GitHub Issue for critical CVEs
        if: env.CRITICAL_COUNT != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const count = process.env.CRITICAL_COUNT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SECURITY] ${count} critical CVE(s) found in ai-soc-api:latest`,
              body: `## Scheduled Trivy Rescan — Critical CVEs Detected\n\n` +
                    `**${count} critical vulnerability/vulnerabilities** found in the published container image.\n\n` +
                    `[View full scan results](${runUrl})\n\n` +
                    `**Action required:** Patch affected packages and release a new image.\n\n` +
                    `_This issue was automatically created by the weekly security scan._`,
              labels: ["security", "critical", "automated"]
            });

  # ── 2. OWASP ZAP rescan ───────────────────────────────────────────────────
  zap-rescan:
    name: "2 · OWASP ZAP API Rescan"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_test
          POSTGRES_DB: soc_pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DSN: postgresql://soc:soc_test@localhost:5432/soc_pipeline
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start FastAPI server
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "Server ready" && break
            sleep 2
          done

      - name: Export OpenAPI spec
        run: curl -sf http://localhost:8000/openapi.json > openapi.json

      - name: OWASP ZAP — full API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8000
          format: openapi
          definition: openapi.json
          fail_action: false
          artifact_name: zap-scheduled-report

      - name: Stop test server
        if: always()
        run: kill $(cat /tmp/uvicorn.pid) || true

  # ── 3. Dependency rescan ──────────────────────────────────────────────────
  dependency-rescan:
    name: "3 · Dependency Rescan (pip-audit + npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pip-audit — Python CVE rescan
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit \
            -r requirements.txt \
            --format json \
            --output pip-audit-scheduled.json \
            --vulnerability-service osv || true
          pip-audit \
            -r requirements.txt \
            --vulnerability-service osv

      - name: npm audit — Node CVE rescan
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm audit --audit-level=high

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-scheduled
          path: backend/pip-audit-scheduled.json
