#
# Release Pipeline — triggered by pushing a semver tag (v*.*.*).
#
# Stages:
#   1. build-sign     — docker build + cosign keyless sign → ghcr.io          ─┐
#   2. sbom-attest    — syft SBOM + cosign SBOM attestation                    ─┤ parallel
#   3. build-electron — Electron installer matrix (Windows/macOS/Linux)        ─┘
#   4. github-release — create GitHub Release with all artifacts (waits for 1-3)
#   5. deploy-k3s     — rolling deploy via self-hosted runner inside K3s (optional)

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  id-token: write   # required for cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-soc-api

jobs:
  # ── Stage 1: Build + Sign ────────────────────────────────────────────────
  build-sign:
    name: "Stage 1 · Build + Cosign Sign"
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push API image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless — sigstore OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ── Stage 2: SBOM + Attestation ──────────────────────────────────────────
  sbom-attest:
    name: "Stage 2 · SBOM + Cosign Attestation"
    runs-on: ubuntu-latest
    needs: build-sign
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign + syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          cosign_version="v2.4.1"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (SPDX)
        run: |
          syft ${{ needs.build-sign.outputs.image-ref }} \
            -o spdx-json=sbom-spdx.json

      - name: Generate SBOM (CycloneDX)
        run: |
          syft ${{ needs.build-sign.outputs.image-ref }} \
            -o cyclonedx-json=sbom-cyclonedx.json

      - name: Attest SBOM with cosign
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json \
            --type spdx \
            ${{ needs.build-sign.outputs.image-ref }}

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # ── Stage 3: Electron Installers ─────────────────────────────────────────
  build-electron:
    name: "Stage 3 · Electron · ${{ matrix.name }}"
    # Runs in parallel with sbom-attest — no dependency on Docker stages.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            build_cmd: build:win
            artifact: electron-windows
          - name: macOS
            runner: macos-latest
            build_cmd: build:mac
            artifact: electron-macos
          - name: Linux
            runner: ubuntu-latest
            build_cmd: build:linux
            artifact: electron-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux: ensure dpkg/fakeroot are available for .deb packaging
      - name: Install Linux packaging deps
        if: matrix.name == 'Linux'
        run: sudo apt-get install -y fakeroot dpkg

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron installer
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Windows code signing ─────────────────────────────────────────
          # Uncomment and add secrets when you have an OV/EV certificate:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}             # base64 PFX
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # ── macOS code signing + notarization ────────────────────────────
          # Uncomment when you have an Apple Developer certificate:
          # CSC_LINK: ${{ secrets.MAC_CSC_LINK }}             # base64 .p12
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.build_cmd }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # Collect installer binaries + blockmap files (delta updates) +
          # latest*.yml (auto-updater feed files read by electron-updater)
          path: |
            frontend/dist-installer/*.exe
            frontend/dist-installer/*.exe.blockmap
            frontend/dist-installer/*.dmg
            frontend/dist-installer/*.dmg.blockmap
            frontend/dist-installer/*.AppImage
            frontend/dist-installer/*.AppImage.blockmap
            frontend/dist-installer/*.deb
            frontend/dist-installer/latest*.yml
          if-no-files-found: warn

  # ── Stage 4: GitHub Release ───────────────────────────────────────────────
  github-release:
    name: "Stage 4 · GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-sign, sbom-attest, build-electron]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: release-files/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: release-files/

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: electron-macos
          path: release-files/

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: electron-linux
          path: release-files/

      - name: List release files
        run: ls -lh release-files/

      - name: Generate release notes from git log
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty="- %s (%h)" "$PREV_TAG"..HEAD)
          else
            NOTES=$(git log --pretty="- %s (%h)")
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI SOC ${{ github.ref_name }}"
          body: |
            ## Desktop Installers

            | Platform | Download |
            |----------|----------|
            | Windows (x64) | `AI SOC Setup ${{ github.ref_name }}.exe` |
            | macOS (x64 + arm64) | `AI SOC-${{ github.ref_name }}.dmg` |
            | Linux AppImage | `AI SOC-${{ github.ref_name }}.AppImage` |
            | Linux deb | `AI SOC_${{ github.ref_name }}_amd64.deb` |

            > **First-time users:** Download the installer for your OS, run it, and follow the setup wizard. Docker Desktop must be installed first.

            ## What's Changed

            ${{ steps.notes.outputs.notes }}

            ## Container Image

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            Verify the image signature:
            ```
            cosign verify \
              --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release.yml" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ## SBOM

            SPDX and CycloneDX SBOMs are attached to this release and attested via cosign.
          files: release-files/**
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # ── Stage 5: Deploy to K3s (self-hosted runner) ───────────────────────────
  deploy-k3s:
    name: "Stage 5 · Deploy to K3s"
    runs-on: [self-hosted, k3s]
    needs: github-release
    # Only deploy tags that are not pre-releases
    if: "!contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')"
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Update K3s deployment image tag
        run: |
          kubectl set image deployment/ai-soc-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --namespace=ai-soc

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ai-soc-api \
            --namespace=ai-soc \
            --timeout=5m

      - name: Smoke test — health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(kubectl exec -n ai-soc deployment/ai-soc-api -- \
              curl -sf http://localhost:8000/health -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 10s"
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1
