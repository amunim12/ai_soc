version: "3.9"

services:
  # ─── Kafka 3.7 in KRaft mode (no Zookeeper) ───────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # PLAINTEXT is for host processes (backend/pipeline run outside Docker);
      # INTERNAL is for containers on the compose network (e.g. hitl_api) —
      # "localhost" inside a container refers to itself, not this broker.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Without this, Kafka writes to its built-in default (/tmp/kraft-combined-logs),
      # NOT the mounted volume below — every container recreation silently wiped
      # all topics/messages/offsets. This makes the mount actually take effect.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: "48"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Retention per topic (default 7 days)
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "-1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg=="
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB ─────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8888:8000"
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # chromadb/chroma:latest ships no curl/wget/python — only bash+coreutils.
      # Use bash's /dev/tcp to confirm the port accepts connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    # Default max_connections=100 is exhausted by our own client pools alone
    # (backend + pipeline + hitl_api's multiple workers each hold a 10-128
    # connection pool) — raise it so real traffic isn't starved.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: soc_pipeline
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── HITL Decision API ────────────────────────────────────────────────────
  hitl_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hitl_api
    ports:
      - "8080:8080"
    environment:
      # .env's connection strings target "localhost", which inside this
      # container refers to itself, not the sibling containers. Override
      # with compose network service names/ports.
      - DATABASE_URL=sqlite:////app/data/hitl.db
      - POSTGRES_DSN=postgresql://soc:${POSTGRES_PASSWORD}@postgres:5432/soc_pipeline
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env

volumes:
  kafka_data:
  redis_data:
  chroma_data:
  pg_data:
